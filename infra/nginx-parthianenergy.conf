server {
    server_name parthianenergy.com www.parthianenergy.com;
    root /var/www/parthianenergy;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/parthianenergy.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/parthianenergy.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.parthianenergy.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = parthianenergy.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name parthianenergy.com www.parthianenergy.com;
    return 404; # managed by Certbot




}