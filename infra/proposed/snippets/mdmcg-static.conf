# Included inside every STATIC location (never inside the backend blocks).
# Install as /etc/nginx/snippets/mdmcg-static.conf
#
# Why it is repeated per location: an add_header inside a location replaces every add_header
# inherited from the server block, so each static location must bring the security headers itself.

add_header X-Frame-Options           SAMEORIGIN always;
add_header X-Content-Type-Options    nosniff always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Referrer-Policy           strict-origin-when-cross-origin always;

# Compression for static text only. Backend responses are left exactly as they are today.
gzip            on;
gzip_vary       on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types      text/css application/javascript text/javascript application/json image/svg+xml text/plain application/xml;
