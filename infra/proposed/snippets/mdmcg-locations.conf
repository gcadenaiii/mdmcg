# Every location of the site. Included by the mdmcg.com server and by the preview server.
# Install as /etc/nginx/snippets/mdmcg-locations.conf
#
# The server block that includes this file sets "root" to a folder holding one assembled release:
#   index.html ...   the new site          v1/   the earlier site (frozen)
#   lab/             the research tools    platform/   the dashboard pages
#
# The access code: /etc/nginx/mdmcg-access.htpasswd, created on the server (see DEPLOY.md).
# The code itself is in no file of this repository.

# =====================================================================================
# BACKEND. The proxy lines below are copied unchanged from infra/nginx.conf.
# =====================================================================================

# Device endpoints: reachable WITHOUT the access code, as today.
# They are already protected by the device key ("Authorization: Bearer ..."), checked by the backend.
# The access code uses the same Authorization header, so asking for it here would not just add a
# second lock: it would make posting impossible for every gateway.
# Must stay ABOVE the general backend block (the first matching regex wins).
location ~ ^/platform/(api/(upload|heartbeat|gateways|patients)|health)(/|$) {
    auth_basic off;
    rewrite ^/platform/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    client_max_body_size 10M;
}

# Live sensor WebSocket stream. Proxy lines unchanged; the access code is added (first two lines).
# To return to today's open behaviour, delete those two lines.
location /platform/ws/ {
    auth_basic           "mdmcg";
    auth_basic_user_file /etc/nginx/mdmcg-access.htpasswd;

    proxy_pass http://127.0.0.1:8080/ws/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# FastAPI backend: the JSON the dashboard reads, and the admin pages.
# Same pattern and proxy lines as today; the access code is added (first two lines), because these
# addresses show patient-labelled data and admin forms and have no login of their own.
# To return to today's open behaviour, delete those two lines.
location ~ ^/platform/(api|upload|heartbeat|gateways|patients|health|admin) {
    auth_basic           "mdmcg";
    auth_basic_user_file /etc/nginx/mdmcg-access.htpasswd;

    rewrite ^/platform/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    client_max_body_size 10M;
}

# =====================================================================================
# STATIC
# =====================================================================================

# ---------- /platform/  the dashboard pages (behind the access code)
location = /platform { return 301 /platform/; }

location /platform/ {                 # not "^~": the backend patterns above must still win
    auth_basic           "mdmcg";
    auth_basic_user_file /etc/nginx/mdmcg-access.htpasswd;

    include snippets/mdmcg-static.conf;
    add_header X-Robots-Tag  "noindex, nofollow" always;
    add_header Cache-Control "no-cache";
    try_files $uri /platform/index.html;        # its own index.html, never the new site's

    location /platform/assets/ {                # file names carry a content hash
        include snippets/mdmcg-static.conf;
        add_header X-Robots-Tag  "noindex, nofollow" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}

# ---------- /lab/  the research tools: Heart Twin and Sensors (behind the access code, for now)
# To open /lab/ to everyone later: delete the two auth_basic lines.
location = /lab { return 301 /lab/; }

location ^~ /lab/ {
    auth_basic           "mdmcg";
    auth_basic_user_file /etc/nginx/mdmcg-access.htpasswd;

    include snippets/mdmcg-static.conf;
    add_header X-Robots-Tag  "noindex, nofollow" always;
    add_header Cache-Control "no-cache";        # index.html and data files: checked each visit, re-sent only if changed
    try_files $uri $uri/ =404;                  # the app uses "#/..." addresses: no fallback needed

    location ^~ /lab/assets/ {                  # file names carry a content hash
        include snippets/mdmcg-static.conf;
        add_header X-Robots-Tag  "noindex, nofollow" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}

# ---------- /v1/  the earlier site, frozen, open to visitors, not indexed
# Not blocked in robots.txt on purpose: a crawler must be able to fetch the page to see "noindex".
location = /v1 { return 301 /v1/; }

location ^~ /v1/ {
    include snippets/mdmcg-static.conf;
    add_header X-Robots-Tag  "noindex, nofollow, noarchive" always;
    add_header Cache-Control "no-cache";
    try_files $uri /v1/index.html;

    location ^~ /v1/assets/ {                   # file names carry a content hash
        include snippets/mdmcg-static.conf;
        add_header X-Robots-Tag  "noindex, nofollow, noarchive" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}

# ---------- /_astro/  the new site's hashed styles, fonts and images
location ^~ /_astro/ {
    include snippets/mdmcg-static.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

# ---------- /  the new site: real pages, a real "not found" page, no single-page fallback
location / {
    include snippets/mdmcg-static.conf;
    add_header Cache-Control "no-cache";
    error_page 404 /404.html;
    try_files $uri $uri/ =404;
}
