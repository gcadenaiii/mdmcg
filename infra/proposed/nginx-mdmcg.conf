# PROPOSED replacement for /etc/nginx/sites-available/rpm (today's file is infra/nginx.conf).
# Nothing here is installed. See DEPLOY.md for the order of steps.
#
# What changes against infra/nginx.conf:
#   - mdmcg.com serves static files from /var/www/mdmcg/current (a symlink to one dated release)
#     instead of the single React app in /var/www/mdmcg.
#   - /v1/, /lab/, /platform/ each get their own block (snippets/mdmcg-locations.conf).
#   - /lab/, the dashboard pages, the dashboard's JSON, the admin pages and the live stream ask for
#     the access code. The device endpoints do not (they keep their own key).
#   - ifiin.com becomes a private preview of a release, entirely behind the access code.
# What does not change: the HTTP-to-HTTPS redirects, the certificates, and every proxy line.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ------------------------------------------------------------------ mdmcg.com
server {
    listen 80;
    server_name mdmcg.com www.mdmcg.com;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name mdmcg.com www.mdmcg.com;

    # TLS certificates (managed by certbot)
    ssl_certificate     /etc/letsencrypt/live/mdmcg.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mdmcg.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Security headers (inherited by the backend blocks, as today)
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # One assembled release. "current" is a symlink; switching it needs no reload.
    root  /var/www/mdmcg/current;
    index index.html;

    include snippets/mdmcg-locations.conf;

    # TRANSITION, remove after 2027-01-31.
    # A browser that still holds the old home page asks for /assets/index-<hash>.js. The old files
    # stay where they are in /var/www/mdmcg/assets, so such a visitor does not get a blank page.
    location ^~ /assets/ {
        root /var/www/mdmcg;
        include snippets/mdmcg-static.conf;
        add_header X-Robots-Tag "noindex" always;
        try_files $uri =404;
    }
}

# ------------------------------------------------------------------ ifiin.com: private preview
server {
    listen 80;
    server_name ifiin.com www.ifiin.com;
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name ifiin.com www.ifiin.com;

    ssl_certificate     /etc/letsencrypt/live/ifiin.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ifiin.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # The whole preview asks for the access code (the device endpoints switch it off for themselves).
    auth_basic           "mdmcg preview";
    auth_basic_user_file /etc/nginx/mdmcg-access.htpasswd;

    # A symlink to the release being checked. Same backend as mdmcg.com, so the dashboard can be tried.
    root  /var/www/ifiin/current;
    index index.html;

    include snippets/mdmcg-locations.conf;
}
